<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Monetix – Earn · Grow · Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030304;--red:#e11d2e;--red2:#ff3b4a;--deep:#6d0912;--text:#f5f5f7;--muted:#8d8d98;--line:rgba(255,255,255,.08);
--font:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;min-height:100vh}
/* atmosphere */
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--deep);top:-120px;left:-120px}
.o2{width:320px;height:320px;background:#4a0610;bottom:-100px;right:-100px;animation-delay:-8s}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);opacity:.5}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75))}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;bottom:-60px;opacity:0;animation:rise linear infinite;will-change:transform}
.fl.dollar{font-weight:700;color:var(--red2);text-shadow:0 0 14px rgba(225,29,46,.8)}
.fl svg{display:block}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.35}88%{opacity:.35}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
#glow{position:fixed;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(225,29,46,.18),transparent 65%);pointer-events:none;z-index:1;left:-300px;top:-300px;transition:left .15s,top .15s}
/* layout */
main{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:40px 20px 34px;text-align:center}
.rise{opacity:0;transform:translateY(18px);animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.logo-wrap{position:relative;width:clamp(140px,44vw,180px);aspect-ratio:1;margin:0 auto 22px}
.logo-wrap::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--red2) 80%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:spin 4s linear infinite}
.logo-wrap::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 50px rgba(225,29,46,.45),0 0 120px rgba(225,29,46,.2);animation:breathe 3.5s ease-in-out infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.55}}
.logo{position:relative;z-index:1;display:block;width:100%;height:auto;aspect-ratio:1;border-radius:50%}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.eyebrow i{width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--red2))}
.eyebrow i:last-child{transform:scaleX(-1)}
h1{margin:0 0 8px;font-size:clamp(24px,7vw,30px);font-weight:700;letter-spacing:-.3px;background:linear-gradient(180deg,#fff,#a8a8b3);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:0 0 30px;font-size:14px;line-height:1.6;color:var(--muted)}
.label{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#5c5c68}
.label::before,.label::after{content:"";flex:1;height:1px;background:var(--line)}
/* cards */
.btn{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 14px;padding:14px 16px;border-radius:18px;color:var(--text);text-decoration:none;text-align:left;position:relative;overflow:hidden;isolation:isolate;transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:-2}
.btn::after{content:"";position:absolute;top:0;left:-90%;width:45%;height:100%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
@keyframes shine{55%,100%{left:140%}}
.btn:hover{transform:scale(1.04)}
.btn:active{transform:scale(.95)}
.btn.primary{border:1px solid rgba(255,110,120,.55);box-shadow:0 10px 36px rgba(225,29,46,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary::before{background:linear-gradient(135deg,#ff3b4a,#a10f1d 60%,#6d0912)}
.btn.primary:hover{box-shadow:0 14px 50px rgba(225,29,46,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.dark{border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 28px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.btn.dark::before{background:linear-gradient(160deg,rgba(32,32,38,.9),rgba(10,10,13,.95))}
.btn.dark:hover{border-color:rgba(255,59,74,.7);box-shadow:0 12px 40px rgba(225,29,46,.3),inset 0 0 30px rgba(225,29,46,.08)}
.tile{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.dark .tile{background:linear-gradient(135deg,rgba(225,29,46,.25),rgba(225,29,46,.06));border-color:rgba(255,59,74,.35)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.txt small{display:block;margin-top:3px;font-size:11.5px;opacity:.7;font-weight:400}
.tag{display:inline-block;margin-bottom:5px;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:rgba(255,255,255,.18)}
.dark .tag{background:rgba(225,29,46,.18);color:#ff7d88;border:1px solid rgba(255,59,74,.3)}
.arrow{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:14px;transition:transform .3s}
.btn:hover .arrow{transform:translateX(3px)}
footer{margin-top:26px;color:#4b4b56;font-size:10px;letter-spacing:4px;text-transform:uppercase}
.spark{position:fixed;z-index:9;pointer-events:none;font-weight:700;animation:spark .8s ease-out forwards;will-change:transform,opacity}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(120deg)}}
@media(min-width:768px){main{padding-top:60px}}
@media(prefers-reduced-motion:reduce){.fl,.orb,.logo-wrap::before,.logo-wrap::after,.btn::after,.rise{animation:none;opacity:1;transform:none}}
</style>
</head>
